<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/leave">LeaveDesk</a>

  <nav class="links" aria-label="Main">
    @for (link of links(); track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <app-notification-bell />

  @if (auth.user(); as user) {
    <span class="user">{{ user.employeeId }} · {{ user.role }}</span>
  }
  <button mat-button class="logout" (click)="logout()">Log out</button>

  <button
    mat-icon-button
    class="menu-button"
    [matMenuTriggerFor]="navMenu"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #navMenu="matMenu">
    @for (link of links(); track link.path) {
      <a mat-menu-item [routerLink]="link.path">{{ link.label }}</a>
    }
    <button mat-menu-item (click)="logout()">Log out</button>
  </mat-menu>
</mat-toolbar>

<main id="main" class="page" tabindex="-1">
  <router-outlet />
</main>
