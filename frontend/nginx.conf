# nginx config for the LeaveDesk web container (UI_SPEC.md §3).
# One address serves both the Angular app and the API: the browser calls /api/..., and nginx
# forwards it to the api service, so no CORS is needed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Smaller downloads for text files (JavaScript, CSS, JSON).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic security headers on every response. (add_header in a location replaces these,
    # so the locations below that add headers repeat them.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Live notifications (Server-Sent Events): pass every byte through immediately, keep the
    # connection open for up to an hour, and don't log the URL, because it holds the token.
    location = /api/notifications/stream {
        proxy_pass http://api:8000/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        access_log off;
    }

    # Everything else under /api/ goes to FastAPI with the /api prefix removed:
    # /api/leave-requests -> http://api:8000/leave-requests
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached for a year.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html must never be cached, so a new deployment is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Angular routes (/leave, /approvals, ...) are not files: serve index.html and let the
    # Angular router show the right page. This also makes a page refresh work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
